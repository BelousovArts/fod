# Сценарий стенда (scripts/stand.py --scenario config/stand_example.yaml).
# at — стоит на этом метре пути от начала записи; ahead — ставить за столько метров впереди,
# после проезда — снова. n — от оси пути, м (+ вправо по ходу); u — поднять над полом, м.
# Типы: python3 scripts/stand.py любая_запись --list
objects:
  - type: person
    ahead: 155
  - type: crate
    ahead: 120
    n: 0.6
  - type: f1_shield          # щит 2 x 1,9 м поперёк пути, как в записи заказчика
    at: 300
  - type: box                # свой размер: поперёк, вдоль, высота
    at: 200
    n: -0.4
    size: [0.4, 0.4, 0.2]
