# Параметры узла детектора на поезде (docker compose и run_live.sh берут этот файл).
#   python3 -m fod_ros.node --ros-args --params-file config/train.yaml
fod:
  ros__parameters:
    # Топик облака лидара; пусто — первый найденный PointCloud2.
    topic: ""
    # cuda или cpu (на cpu тракт в несколько раз медленнее 10 Гц).
    device: cuda
    # Маркеры для RViz (/fod/markers); на поезде без RViz можно выключить.
    markers: true
    # true — подписка BEST_EFFORT, если драйвер лидара публикует только так.
    best_effort: false
    # Установка лидара: какая его ось смотрит вперёд по ходу поезда (-y, +y, +x, -x)
    # и какая вверх (+z, -z — лидар вверх ногами).
    forward: "-y"
    up: "+z"
    # Поправки установки, градусы: крен (+ — верх лидара наклонён вправо),
    # тангаж (+ — смотрит вниз), рыскание (+ — повёрнут влево).
    rpy: [0.0, 0.0, 0.0]
