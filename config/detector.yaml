# Габарит и детектор препятствий. Высоты — от головок рельсов:
# минус ниже головок, плюс выше. После правки перезапустите узел
# (`docker compose restart fod`); офлайн-скрипты читают файл при старте.
#
# Поперечный профиль дна, от края габарита к оси и снова к краю:
# низко у рельсов и по бокам, между рельсами дно выше (вырез _/--\_).
# Одинаково на всех дальностях.

gauge:
  half_width: 1.05       # ±м от оси; полная ширина 2.10 м
  height: 3.00           # верх габарита над головками, м
  floor: -0.10           # дно ниже головок у рельсов и по краям, м
  notch:
    half_width: 0.50     # плоская часть выреза между рельсами, ±м от оси
    ramp: 0.22           # ширина скоса до полного дна, м; рельс (~0.76 м) уже на дне
    top: 0.06            # дно выреза над головками, м

detector:
  # Сюда же можно дописать любое поле ObstacleConfig (fod/obstacles.py).
  # Ближе не смотрим (крыша поезда и слепая зона), дальше — пока известна ось, но не дальше этого.
  s_min: 4.0
  s_max: 150.0
  # Выше нормы полотна — кандидат. До margin_knee порог растёт на margin_per_m
  # за метр, дальше — на margin_far_per_m. На 56 м выходит около 12 см: предмет
  # на рельсе в doubleT_obstacle (13 см) проходит. Один наклон на все дальности
  # не разделяет его и ложные 25–30 см на 100–140 м.
  margin: 0.06
  margin_per_m: 0.001
  margin_knee: 60.0
  margin_far_per_m: 0.008
  # Дальше far_s габарит сужается и опускается: ошибка оси задевает стены и свод.
  far_s: 60.0
  far_shrink_n: 0.006    # м ширины на метр дальности, с каждого края
  far_shrink_h: 0.015    # м высоты на метр дальности
  # Подтверждение: столько попаданий в окне из confirm_window кадров.
  confirm_hits: 4
  confirm_window: 5
  # Поднять дно до головок дальше этой дальности. Больше s_max — не поднимать
  # (дно везде как в gauge). 30 — прежнее поведение, низкие предметы вдали пропадали.
  rail_level_s: 10000
  # Прежняя надбавка порога между рельсами, м. 0 — вместо неё вырез gauge.notch.
  inner_raise: 0.0
  inner_half: 0.85
  # Между рельсами отбрасывать кандидата, если его верх ниже головок на столько.
  # Большой минус — не проверять (это делает вырез).
  inner_top: -10
